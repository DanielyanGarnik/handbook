name: Sync wiki

# Документация живёт в репозитории и проходит review через Pull Request.
# Wiki — только витрина: она перезаписывается из docs/ при каждом пуше в main.

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'templates/**'
      - 'scripts/sync-wiki.sh'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build wiki pages
        run: bash scripts/sync-wiki.sh wiki-out

      - name: Clone wiki
        run: |
          git clone \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" \
            wiki

      - name: Publish
        run: |
          rm -f wiki/*.md
          cp wiki-out/*.md wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki уже актуальна, коммит не нужен."
          else
            git commit -m "docs: sync wiki from ${GITHUB_SHA:0:7}"
            git push
          fi
